<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de defesas de TCC</title>
<meta name="description" content="Agenda de defesas de TCC 1 e TCC 2 do curso de Ciência da Computação da UFT, Câmpus de Palmas.">
<meta property="og:type" content="website">
<meta property="og:title" content="Agenda de defesas de TCC">
<meta property="og:description" content="Defesas de TCC 1 e TCC 2 da Ciência da Computação, UFT Palmas.">
<meta property="og:url" content="https://cser-uft.github.io/defesas/">
<style>
  :root { --azul:#2F6FEB; --azul-bg:#E8F0FE; --ink:#1F2933; --mut:#5F6B7A; --line:#E3E7EC; --bg:#F7F8FA; --cinza:#F1F3F6; --bord:#D5DAE1; --hp:72px; --r:10px; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,"Segoe UI",Roboto,sans-serif; margin:0; color:var(--ink); background:var(--bg); line-height:1.45; }
  :focus-visible { outline:2px solid var(--azul); outline-offset:2px; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:10px 24px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
  header .ti { display:flex; align-items:center; gap:8px; }
  header h1 { font-size:1.05rem; margin:0; font-weight:600; letter-spacing:-.01em; }
  .ponto { width:8px; height:8px; border-radius:50%; background:#E0A100; display:none; }
  .ponto.on { display:inline-block; }
  header .bt { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  header .sim { font-size:.75rem; color:var(--mut); display:flex; align-items:center; gap:6px; }
  header input[type=date] { padding:2px 4px; font:inherit; font-size:.75rem; color:var(--mut); border:1px solid var(--line); border-radius:6px; background:#fff; }
  main { padding:18px 24px 40px; max-width:1280px; margin:auto; }
  button { font:inherit; font-size:.88rem; padding:6px 12px; border:1px solid var(--bord); background:#fff; color:var(--ink); border-radius:8px; cursor:pointer; transition:background .12s, border-color .12s; }
  button:hover { background:var(--cinza); }
  button.pri { background:var(--azul); color:#fff; border-color:var(--azul); }
  button.pri:hover { background:#255ccb; }
  button.perigo { color:#B42318; border-color:#F0C4C0; }
  button.sel { background:var(--azul); color:#fff; border-color:var(--azul); }
  header button { border-color:transparent; background:transparent; }
  header button:hover { background:var(--cinza); }
  header button.pri { background:var(--azul); }
  header button.pri:hover { background:#255ccb; }
  details.menu { position:relative; }
  details.menu summary { list-style:none; cursor:pointer; font-size:.88rem; padding:6px 12px; border-radius:8px; }
  details.menu summary::-webkit-details-marker { display:none; }
  details.menu summary::after { content:" ▾"; color:var(--mut); }
  details.menu summary:hover, details.menu[open] summary { background:var(--cinza); }
  .painelMenu { position:absolute; right:0; top:110%; z-index:20; background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:6px; min-width:190px; display:flex; flex-direction:column; gap:2px; box-shadow:0 0 0 1px #0000000a, 0 8px 24px #1f293314; }
  .painelMenu button { text-align:left; border-color:transparent; }
  .abas { display:flex; gap:20px; margin-bottom:16px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  .abas button { background:none; border:0; border-bottom:2px solid transparent; border-radius:0; padding:8px 2px; color:var(--mut); margin-bottom:-1px; }
  .abas button:hover { background:none; color:var(--ink); }
  .abas button.sel { background:none; color:var(--ink); font-weight:600; border-bottom-color:var(--azul); }
  #status { font-size:.82rem; color:var(--mut); min-height:1.2em; margin-bottom:8px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center; margin-bottom:12px; }
  .seg2 { display:inline-flex; border:1px solid var(--bord); border-radius:8px; overflow:hidden; background:#fff; }
  .seg2 button { border:0; border-radius:0; border-left:1px solid var(--line); padding:6px 12px; }
  .seg2 button:first-child { border-left:0; }
  #rotSemana { font-size:1rem; font-weight:600; letter-spacing:-.01em; }
  .legenda { display:flex; flex-wrap:wrap; gap:4px 14px; align-items:center; font-size:.78rem; color:var(--mut); margin-left:auto; }
  .legenda i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:0; }
  .dica { color:var(--mut); font-size:.78rem; margin-top:8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:12px; font-size:.78rem; color:var(--mut); }
  .chip { padding:3px 11px; font-size:.8rem; border-radius:999px; color:var(--mut); }
  .chip.on { background:var(--azul-bg); border-color:#B9D0FA; color:#1B4FB8; }
  .grade { display:grid; grid-template-columns:52px repeat(5, 1fr); border:1px solid var(--line); border-radius:12px; background:#fff; position:relative; }
  .grade .cab { background:#fff; border-bottom:1px solid var(--line); border-left:1px solid var(--line); padding:8px 5px; text-align:center; font-weight:500; font-size:.82rem; color:var(--mut); position:sticky; top:0; z-index:4; }
  .grade .cab:first-child { border-left:0; border-top-left-radius:12px; }
  .grade .cab:last-child { border-top-right-radius:12px; }
  .grade .cab.hoje { color:var(--azul); background:#F3F7FF; font-weight:600; }
  .eixo { position:relative; height:calc(var(--hp) * 10); }
  .eixo span { position:absolute; right:7px; font-size:.7rem; color:var(--mut); transform:translateY(-50%); }
  .eixo span:first-child { transform:translateY(3px); }
  .dia { position:relative; height:calc(var(--hp) * 10); border-left:1px solid var(--line);
         background-image:linear-gradient(#E9ECF0 1px, transparent 1px), linear-gradient(#F4F5F8 1px, transparent 1px);
         background-size:100% var(--hp), 100% calc(var(--hp) / 2); }
  .dia.hoje { background-color:#F8FAFF; }
  .editando .dia { cursor:copy; }
  .seg { position:absolute; left:0; right:0; font-size:.7rem; padding:2px 5px; overflow:hidden; pointer-events:none; }
  .seg.livre { background:#E3F4EA; color:#1F7A4D; }
  .seg.ocup { background:#ECEEF2; color:var(--mut); }
  .card { position:absolute; border-radius:6px; padding:4px 7px; font-size:.72rem; overflow:hidden; border-left:3px solid; cursor:pointer; line-height:1.3; color:var(--ink); }
  .editando .card { cursor:grab; touch-action:none; user-select:none; }
  #cvCard { width:100%; max-width:520px; border:1px solid var(--line); display:block; margin:0 auto 10px; }
  .card.arrastando { opacity:.4; }
  .fantasma { position:absolute; left:0; right:3px; border:2px dashed var(--azul); background:#2F6FEB1f; border-radius:6px; z-index:5; pointer-events:none; font-size:.72rem; padding:2px 6px; color:var(--azul); font-weight:600; }
  .card b { display:block; font-size:.78rem; font-weight:600; padding-right:30px; }
  .card .hr, .card .sl { display:block; color:var(--mut); }
  .card em { display:block; font-style:normal; color:var(--ink); opacity:.85; }
  .card .fb { position:absolute; top:3px; right:5px; font-size:.62rem; font-weight:600; padding:0 5px; border-radius:999px; background:#ffffffb0; }
  .card.curto em, .card.curto .sl { display:none !important; }
  .f1 { background:#E8F0FE; border-color:#2F6FEB; } .f1 .fb { color:#1B4FB8; }
  .f2 { background:#FFF1E0; border-color:#D9822B; } .f2 .fb { color:#9A5712; }
  .f12 { background:#F0E9FB; border-color:#7A4FD1; } .f12 .fb { color:#5A33A8; }
  .card.conflito, .f1.conflito, .f2.conflito, .f12.conflito { background:#FDE8E8; border-color:#D64545; box-shadow:0 0 0 1px #D64545 inset; }
  .card.conflito .fb { color:#B42318; }
  .card .al { position:absolute; bottom:3px; right:5px; width:15px; height:15px; border-radius:50%; background:#D64545; color:#fff; font-size:.65rem; font-weight:700; display:flex; align-items:center; justify-content:center; }
  table.lista { border-collapse:collapse; width:100%; background:#fff; font-size:.88rem; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .lista th, .lista td { border:0; border-bottom:1px solid var(--line); padding:9px 12px; text-align:left; }
  .lista th { background:#fff; color:var(--mut); font-weight:500; font-size:.76rem; }
  .lista tr:last-child td { border-bottom:0; }
  .lista tbody tr:hover td, .lista tr:hover td { background:#FAFBFC; }
  .lista td select { height:30px; padding:0 8px; font:inherit; font-size:.84rem; border:1px solid var(--bord); border-radius:8px; background:#fff; }
  @media (hover:hover) { .lista td button { opacity:0; transition:opacity .12s; } .lista tr:hover td button, .lista td button:focus-visible { opacity:1; } }
  h2 { font-size:.95rem; margin:22px 0 8px; font-weight:600; }
  dialog { border:0; border-radius:14px; padding:22px; max-width:620px; width:94%; color:var(--ink); box-shadow:0 0 0 1px #0000000f, 0 20px 50px #1f293338; }
  dialog h3 { margin:0 0 6px; font-size:1.05rem; font-weight:600; }
  dialog::backdrop { background:#1f293366; }
  dialog label.l { display:block; margin:12px 0 4px; font-size:.78rem; font-weight:500; color:var(--mut); }
  dialog input, dialog select { width:100%; padding:0 10px; height:36px; font:inherit; border:1px solid var(--bord); border-radius:8px; background:#fff; }
  dialog input:focus, dialog select:focus, .form1 input:focus, .form1 select:focus { outline:none; border-color:var(--azul); box-shadow:0 0 0 3px #2F6FEB26; }
  dialog .linha { display:flex; gap:12px; }
  dialog .linha > div { flex:1; }
  dialog .checks label { display:inline-block; font-weight:400; margin-right:14px; font-size:.88rem; color:var(--ink); }
  dialog .checks input { width:auto; height:auto; }
  .acoes { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap; }
  .aviso { background:#FFF7E0; border:1px solid #F0D98C; border-radius:8px; padding:9px 11px; margin-top:12px; font-size:.84rem; }
  .oculto { display:none !important; }
  .form1 { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; align-items:center; }
  .form1 input, .form1 select { height:34px; padding:0 9px; font:inherit; border:1px solid var(--bord); border-radius:8px; background:#fff; }
  small.n { color:var(--mut); }
  @media print { header, .abas, .chips, .toolbar, .dica, #status { display:none !important; } .editando .dia { cursor:auto; } }
  a.bt { display:inline-block; font-size:.88rem; padding:6px 12px; border:1px solid var(--bord); border-radius:8px; color:var(--azul); text-decoration:none; background:#fff; }
  a.bt:hover { background:var(--cinza); }
  .itemDia a { color:var(--azul); margin-right:12px; font-size:.8rem; }
  .listaDias h2 { margin:18px 0 6px; font-size:.9rem; color:var(--mut); }
  .listaDias h2.hoje { color:var(--azul); }
  .itemDia { border-left:3px solid; border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:.85rem; cursor:pointer; }
  .itemDia b { display:block; font-size:.92rem; }
  .itemDia .hr { color:var(--mut); font-size:.78rem; }
  .itemDia.conflito { background:#FDE8E8; border-color:#D64545; }
  .listaDias .vazio, .listaDias .livres { font-size:.8rem; color:var(--mut); margin-bottom:4px; }
  .listaDias .livres { color:#1F7A4D; }
  @media (max-width:760px) { main { padding:12px 12px 32px; } header { padding:8px 12px; } .legenda { margin-left:0; } }
  #folhaImp { display:none; }
  #folhaImp h1 { font-size:16px; margin:0 0 2px; } #folhaImp .sub { font-size:11px; color:#444; margin-bottom:10px; }
  #folhaImp h2 { font-size:13px; margin:16px 0 4px; }
  #folhaImp table { border-collapse:collapse; width:100%; font-size:10.5px; }
  #folhaImp th, #folhaImp td { border:1px solid #777; padding:3px 5px; text-align:left; vertical-align:top; }
  #folhaImp th { background:#e4e4e4; } #folhaImp tr { page-break-inside:avoid; }
  #folhaImp td.c { text-align:center; white-space:nowrap; }
  @media print { body.impTab > *:not(#folhaImp) { display:none !important; } body.impTab #folhaImp { display:block; } }
</style>
</head>
<body>
<header>
  <div class="ti"><h1 id="titulo">Agenda de defesas de TCC</h1><span id="ponto" class="ponto" title="Alterações não salvas" aria-label="Alterações não salvas"></span></div>
  <div class="bt">
    <label class="sim">Simular hoje <input type="date" id="simHoje"></label>
    <details class="menu" id="menuArq"><summary>Arquivo</summary>
      <div class="painelMenu">
        <button id="btnReabrir" class="oculto">Reabrir último arquivo</button>
        <button id="btnNovoArq">Novo arquivo</button>
        <button id="btnAbrir">Abrir arquivo</button>
        <input type="file" id="arqJson" accept=".json,application/json" class="oculto">
        <button id="btnSalvar" class="oculto">Salvar</button>
      </div>
    </details>
    <button id="btnImp">Imprimir</button>
    <button id="btnEditar">Modo edição</button>
    <button id="btnNova" class="oculto pri">Nova defesa</button>
  </div>
</header>
<main id="main">
  <div id="status"></div>
  <div class="abas" id="abas"></div>
  <div id="painel"></div>
</main>

<dialog id="dlgDefesa">
  <h3 id="tituloDefesa">Defesa</h3>
  <label class="l">Aluno</label><select id="fAluno"></select>
  <label class="l">Fases defendidas</label>
  <div class="checks"><label><input type="checkbox" id="fT1"> TCC1</label><label><input type="checkbox" id="fT2"> TCC2</label></div>
  <label class="l">Título do trabalho</label><input id="fTitulo" placeholder="Título da monografia">
  <div class="linha">
    <div><label class="l">Data</label><input type="date" id="fData"></div>
    <div><label class="l">Início</label><select id="fIni"></select></div>
    <div><label class="l">Duração (minutos)</label><input type="number" id="fDur" min="15" step="5"></div>
  </div>
  <div class="form1"><button type="button" data-d="30">30 min</button><button type="button" data-d="40">40 min</button><button type="button" data-d="60">60 min</button><span id="fFimTxt" style="align-self:center;font-size:.85rem"></span></div>
  <label class="l">Sala ou link</label><select id="fSala"></select>
  <label class="l">Banca</label><div class="checks" id="fBanca"></div>
  <label class="l">PDF do trabalho (fica público no site)</label>
  <div class="form1" style="margin:0"><span id="fPdfNome" class="n" style="flex:1"></span><button type="button" id="fPdfEsc">Escolher PDF</button><button type="button" id="fPdfRem" class="perigo">Remover</button><input type="file" id="fPdfArq" accept="application/pdf,.pdf" class="oculto"></div>
  <div id="fAviso" class="aviso oculto"></div>
  <div class="acoes">
    <button type="button" id="fCard">Gerar card</button>
    <button type="button" id="fZip">Atas e fichas (ZIP de PDFs)</button>
    <button type="button" id="fExcluir" class="perigo">Excluir</button>
    <button type="button" id="fCancelar">Cancelar</button>
    <button type="button" id="fOk" class="pri">Gravar</button>
  </div>
</dialog>

<dialog id="dlgImp">
  <h3>Imprimir planilha e documentos das defesas</h3>
  <div class="form1"><label>Período <select id="impEsc"><option value="semana">Semana exibida</option><option value="futuras">Defesas de hoje em diante</option><option value="todas">Todas as defesas</option></select></label></div>
  <div class="acoes"><button type="button" id="impFechar">Fechar</button><button type="button" id="impCsv">Baixar CSV</button><button type="button" id="impZip">ZIP de atas e fichas (PDF)</button><button type="button" id="impOk" class="pri">Imprimir</button></div>
</dialog>

<div id="folhaImp"></div>

<dialog id="dlgCard">
  <h3>Card de divulgação</h3>
  <canvas id="cvCard" width="1080" height="1080"></canvas>
  <div class="form1" id="cdLinks"></div>
  <div class="form1"><label>Paleta <select id="cdPaleta"></select></label><button type="button" id="cdSortear">Sortear outra</button></div>
  <div class="acoes"><button type="button" id="cdFechar">Fechar</button><button type="button" id="cdLink">Copiar link</button><button type="button" id="cdZip">Atas e fichas (ZIP de PDFs)</button><button type="button" id="cdBaixar" class="pri">Baixar PNG</button></div>
</dialog>

<dialog id="dlgAluno">
  <h3 id="tituloAluno">Aluno</h3>
  <label class="l">Nome</label><input id="aNome">
  <label class="l">Orientador</label><select id="aOrient"></select>
  <label class="l">Coorientador (opcional)</label><select id="aCoorient"></select>
  <label class="l">Fase</label>
  <select id="aFase"><option value="">Automática (pela data das defesas)</option><option value="TCC1">Forçar TCC1</option><option value="TCC2">Forçar TCC2</option></select>
  <div class="acoes">
    <button type="button" id="aConcluir">Marcar como concluído</button>
    <button type="button" id="aRemover" class="perigo">Remover</button>
    <button type="button" id="aCancelar">Cancelar</button>
    <button type="button" id="aOk" class="pri">Gravar</button>
  </div>
</dialog>

<script>
"use strict";
const HP = 72;               // pixels por hora na grade
const DIA_INI = 8 * 60;      // 08:00
const DIA_FIM = 18 * 60;     // 18:00
const NOMES_DIA = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta"];

const AGENDA_INICIAL = {
  formato: "agendatcc", schema: 1, nome: "Agenda de TCC", salvoEm: 0,
  config: { titulo: "AGENDA DE DEFESAS DE TCC", subtitulo: "", coordenador: "", cargo: "", unidade: "" },
  professores: [
    { id: "p1", nome: "Tiago Almeida", curto: "Tiago Almeida" },
    { id: "p2", nome: "Professor Exemplo A", curto: "Prof. A" },
    { id: "p3", nome: "Professora Exemplo B", curto: "Prof. B" },
    { id: "p4", nome: "Professor Exemplo C", curto: "Prof. C" }
  ],
  salas: [
    { id: "s1", nome: "Sala 1", curto: "Sala 1" },
    { id: "s2", nome: "Sala 2", curto: "Sala 2" },
    { id: "s3", nome: "Remoto", curto: "Remoto" }
  ],
  alunos: [
    { id: "a1", nome: "Aluno Exemplo 1 (TCC1 agendado)", orientadorId: "p1", coorientadorId: null, faseManual: null, concluido: false },
    { id: "a2", nome: "Aluno Exemplo 2 (TCC1 já defendido)", orientadorId: "p1", coorientadorId: null, faseManual: null, concluido: false },
    { id: "a3", nome: "Aluno Exemplo 3 (defesa combinada)", orientadorId: "p2", coorientadorId: "p3", faseManual: null, concluido: false },
    { id: "a4", nome: "Aluno Exemplo 4 (sem agenda)", orientadorId: "p1", coorientadorId: null, faseManual: null, concluido: false },
    { id: "a5", nome: "Aluno Exemplo 5 (concluído, não aparece)", orientadorId: "p3", coorientadorId: null, faseManual: null, concluido: true }
  ],
  defesas: [
    { id: "d1", alunoId: "a1", fases: ["TCC1"], titulo: "Multiplicadores aproximados em FPGA", data: "30/11/2026", inicio: "09:00", duracao: 40, salaId: "s1", bancaIds: ["p1", "p2", "p3"] },
    { id: "d2", alunoId: "a2", fases: ["TCC1"], titulo: "Ordenação aproximada com medição de energia", data: "09/11/2026", inicio: "14:00", duracao: 40, salaId: "s1", bancaIds: ["p1", "p3", "p4"] },
    { id: "d3", alunoId: "a3", fases: ["TCC1", "TCC2"], titulo: "Convolução aproximada em linguagem C", data: "01/12/2026", inicio: "14:15", duracao: 60, salaId: "s2", bancaIds: ["p2", "p1", "p4"] },
    { id: "d4", alunoId: "a5", fases: ["TCC2"], data: "05/11/2026", inicio: "10:00", duracao: 30, salaId: "s1", bancaIds: ["p3", "p1", "p2"] }
  ],
  indisponibilidades: [
    { profId: "p2", data: "30/11/2026", inicio: "14:00", fim: "18:00", motivo: "Aula" }
  ],
  log: []
};

let data = null;
let semana = null;
let editando = false;
let sujo = false;
let aba = "grade";
let editDefesaId = null;
let editAlunoId = null;
let pdfAtual = "";
let selecionados = new Set();
let filtroProf = null;       // id do professor cuja agenda está sendo exibida (link ?prof=)

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const TRACO = String.fromCharCode(45);

function parseBR(s) { const p = s.split("/").map(Number); return new Date(p[2], p[1] - 1, p[0]); }
function fmtBR(dt) { return pad(dt.getDate()) + "/" + pad(dt.getMonth() + 1) + "/" + dt.getFullYear(); }
function fmtCurto(dt) { return pad(dt.getDate()) + "/" + pad(dt.getMonth() + 1); }
function paraInput(s) { const dt = parseBR(s); return dt.getFullYear() + TRACO + pad(dt.getMonth() + 1) + TRACO + pad(dt.getDate()); }
function deInput(v) { const p = v.split(TRACO).map(Number); return pad(p[2]) + "/" + pad(p[1]) + "/" + p[0]; }
function toMin(h) { const p = h.split(":").map(Number); return p[0] * 60 + p[1]; }
function fmtMin(m) { return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
function segunda(dt) { const r = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()); r.setDate(r.getDate() - ((r.getDay() + 6) % 7)); return r; }
function somaDias(dt, n) { const r = new Date(dt); r.setDate(r.getDate() + n); return r; }
function novoId(p) { return p + Date.now().toString(36) + Math.floor(Math.random() * 46656).toString(36); }

// Regras de fase
function defesasDoAluno(id) {
  return data.defesas.filter(d => d.alunoId === id).sort((a, b) => (parseBR(a.data) - parseBR(b.data)) || (toMin(a.inicio) - toMin(b.inicio)));
}
function estadoAluno(a) {
  if (a.concluido) return { fase: "concluído", manual: false };
  const h = hoje();
  const ds = defesasDoAluno(a.id);
  const passou = d => parseBR(d.data) < h;
  if (ds.some(d => d.fases.includes("TCC2") && passou(d))) return { fase: "concluído", manual: false };
  if (a.faseManual) return { fase: a.faseManual, manual: true };
  return { fase: ds.some(d => d.fases.includes("TCC1") && passou(d)) ? "TCC2" : "TCC1", manual: false };
}
function alunosAtivos() { return porNome(data.alunos.filter(a => estadoAluno(a).fase !== "concluído")); }
function proximaDefesa(a) { const h = hoje(); return defesasDoAluno(a.id).find(d => parseBR(d.data) >= h); }

// Disponibilidade e conflitos
function ocupadoPara(profIds, dataStr, ini, fim, ignorarId) {
  for (const d of data.defesas) {
    if (d.id === ignorarId || d.data !== dataStr) continue;
    if (sobrepoe(ini, fim, toMin(d.inicio), fimMin(d)) && [...profIds].some(x => participa(d, x))) return "Em defesa";
  }
  for (const i of data.indisponibilidades) {
    if (i.data !== dataStr || !profIds.has(i.profId)) continue;
    if (sobrepoe(ini, fim, toMin(i.inicio), toMin(i.fim))) return nomeProf(i.profId) + (i.motivo ? ": " + i.motivo : " indisponível");
  }
  return null;
}
function conflitos(n) {
  const out = [];
  const ini = toMin(n.inicio), fim = ini + n.duracao;
  data.defesas.forEach(d => {
    if (d.id === n.id || d.data !== n.data || !sobrepoe(ini, fim, toMin(d.inicio), fimMin(d))) return;
    d.bancaIds.filter(x => n.bancaIds.includes(x)).forEach(x => out.push(nomeProf(x) + " já está em outra banca nesse horário"));
    if (n.salaId && d.salaId === n.salaId) out.push("A sala " + nomeSala(n.salaId) + " já está em uso nesse horário");
  });
  data.indisponibilidades.forEach(i => {
    if (i.data === n.data && n.bancaIds.includes(i.profId) && sobrepoe(ini, fim, toMin(i.inicio), toMin(i.fim)))
      out.push(nomeProf(i.profId) + " indisponível" + (i.motivo ? " (" + i.motivo + ")" : ""));
  });
  return out;
}

    if (!livre && ini !== null) { if (m - ini >= 30) out.push(fmtMin(ini) + " às " + fmtMin(m)); ini = null; }
  }
  return out;
}

function colunaDia(dia) {
  const ds = fmtBR(dia);
  const col = document.createElement("div"); col.className = "dia" + (ds === fmtBR(hoje()) ? " hoje" : ""); col.dataset.data = ds;
  if (selecionados.size) {
    let atual = null;
    const fecha = fimSeg => { if (atual) { atual.fim = fimSeg; desenharSeg(col, atual); atual = null; } };
    for (let m = DIA_INI; m < DIA_FIM; m += 15) {
      const r = ocupadoPara(selecionados, ds, m, m + 15, null);
      const chave = r === null ? "livre" : r;
      if (!atual || atual.chave !== chave) { fecha(m); atual = { chave: chave, ini: m, motivo: r }; }
    }
    fecha(DIA_FIM);
  }
  const lista = defesasVisiveis().filter(d => d.data === ds).sort((a, b) => toMin(a.inicio) - toMin(b.inicio));
  const faixa = []; let fimCluster = -1; let cluster = [];
  const fechaCluster = () => { if (!cluster.length) return; const n = Math.max(...cluster.map(x => x.lane)) + 1; cluster.forEach(x => { x.n = n; faixa.push(x); }); cluster = []; };
  lista.forEach(d => {
    const ini = toMin(d.inicio);
    if (ini >= fimCluster) { fechaCluster(); fimCluster = -1; }
    const usadas = cluster.filter(x => fimMin(x.d) > ini).map(x => x.lane);
    let lane = 0; while (usadas.includes(lane)) lane++;
    cluster.push({ d: d, lane: lane });
    fimCluster = Math.max(fimCluster, fimMin(d));
  });
  fechaCluster();
  faixa.forEach(x => col.append(cartao(x)));
  col.onclick = ev => {
    if (!editando || ev.target !== col) return;
    const y = ev.offsetY;
    const m = DIA_INI + Math.floor(y / HP * 60 / 15) * 15;
    abrirDefesa(null, ds, fmtMin(Math.min(m, DIA_FIM - 15)));
  };
  return col;
}
function desenharSeg(col, s) {
  const el = document.createElement("div");
  el.className = "seg " + (s.motivo === null ? "livre" : "ocup");
  el.style.top = ((s.ini - DIA_INI) / 60 * HP) + "px";

  col.append(el);
}
function cartao(x) {

  el.title = (al ? al.nome : "?") + (d.titulo ? "\n" + d.titulo : "") + "\n" + rotuloFases(d.fases) + "\n" + d.inicio + " às " + fmtMin(fimMin(d)) + " (" + d.duracao + " min)\n" + nomeSala(d.salaId) + (d.pdf ? "\nCom PDF do trabalho" : "") + "\nBanca: " + d.bancaIds.map(id => (prof(id) || { nome: "?" }).nome).join(", ") + (cf.length ? "\n\nCONFLITO:\n" + [...new Set(cf)].join("\n") : "");
  el.onclick = ev => { ev.stopPropagation(); if (!editando) abrirCard(d); };
  el.addEventListener("pointerdown", ev => iniciarArrasto(ev, d, el));
  return el;

// Arrastar defesa para outro dia ou horário
function iniciarArrasto(ev, d, el) {
  if (!editando || ev.button > 0) return;
  ev.preventDefault();
  const colunas = [...document.querySelectorAll(".dia")];
  const grab = ev.clientY - el.getBoundingClientRect().top;
  const x0 = ev.clientX, y0 = ev.clientY;
  let moved = false, alvo = null, fantasma = null;
  el.setPointerCapture(ev.pointerId);
  const calc = e => {
    const col = colunas.find(c => { const r = c.getBoundingClientRect(); return e.clientX >= r.left && e.clientX < r.right; });
    if (!col) return null;
    const r = col.getBoundingClientRect();
    let m = DIA_INI + Math.round((e.clientY - r.top - grab) / HP * 4) * 15;
    m = Math.max(DIA_INI, Math.min(m, DIA_FIM - d.duracao));
    return { col: col, m: m };
  };
  const mover = e => {
    if (!moved && Math.hypot(e.clientX - x0, e.clientY - y0) < 5) return;
    if (!moved) { moved = true; el.classList.add("arrastando"); }
    alvo = calc(e);
    if (fantasma) { fantasma.remove(); fantasma = null; }
    if (!alvo) return;
    fantasma = document.createElement("div"); fantasma.className = "fantasma";
    fantasma.style.top = ((alvo.m - DIA_INI) / 60 * HP) + "px";
    fantasma.style.height = (Math.max(d.duracao / 60 * HP, 18) - 2) + "px";
    fantasma.textContent = fmtMin(alvo.m) + " às " + fmtMin(alvo.m + d.duracao);
    alvo.col.append(fantasma);
  };
  const limpar = () => {
    el.removeEventListener("pointermove", mover); el.removeEventListener("pointerup", fim); el.removeEventListener("pointercancel", cancelar);
    if (fantasma) fantasma.remove();
    el.classList.remove("arrastando");
  };
  const cancelar = () => limpar();
  const fim = () => {
    limpar();
    if (!moved) { abrirDefesa(d.id); return; }
    if (!alvo) return;
    const novoDia = alvo.col.dataset.data, novoIni = fmtMin(alvo.m);
    if (novoDia === d.data && novoIni === d.inicio) return;
    const n = Object.assign({}, d, { data: novoDia, inicio: novoIni });
    const antes = d.data + " " + d.inicio;
    d.data = novoDia; d.inicio = novoIni;
    reg("defesa", "Defesa de «" + (aluno(d.alunoId) || { nome: "?" }).nome + "» movida de " + antes + " para " + novoDia + " " + novoIni + ".");
    desenhar();
  };
  el.addEventListener("pointermove", mover); el.addEventListener("pointerup", fim); el.addEventListener("pointercancel", cancelar);
}

// Card de divulgação (reproduz o layout do card em LaTeX, com paleta sorteada)
const FONTE = '"Courier New", Courier, "Liberation Mono", "Nimbus Mono PS", monospace';
const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const rgbCor = a => "rgb(" + a[0] + "," + a[1] + "," + a[2] + ")";

function infoCard(d) {
  const al = aluno(d.alunoId) || { nome: "" };
  const dt = parseBR(d.data), mi = toMin(d.inicio), h = Math.floor(mi / 60), m = mi % 60;
  const o = prof(al.orientadorId), co = al.coorientadorId ? prof(al.coorientadorId) : null;
  const sala = d.salaId ? data.salas.find(x => x.id === d.salaId) : null;
  return {
    tcc: d.fases.length === 2 ? "1 e 2" : d.fases[0].replace("TCC", ""),
    aluno: al.nome, titulo: (d.titulo || "A definir").toUpperCase(),
    orientador: o ? o.nome : "", coorientador: co ? co.nome : "",
    data: dt.getDate() + " de " + MESES[dt.getMonth()] + " às " + h + "h" + (m ? pad(m) : ""),
    local: sala ? sala.nome : "A definir"
  };
}
function quebrarTexto(segs, maxChars) {
  const chars = []; segs.forEach(s => { for (const ch of s.t) chars.push({ ch: ch, c: s.c }); });
  const linhas = []; let i = 0;
  while (i < chars.length) {
    let fim = Math.min(i + maxChars, chars.length);
    if (fim < chars.length) { let k = fim; while (k > i && chars[k].ch !== " ") k--; if (k > i) fim = k; }
    linhas.push(chars.slice(i, fim));
    i = fim; while (i < chars.length && chars[i].ch === " ") i++;
  }
  return linhas;
}
function desenharCard(cv, info, pal) {
  const c = cv.getContext("2d"); cv.width = 1080; cv.height = 1080;
  const P = k => rgbCor(pal[k]);
  const texto = (t, x, y, fonte, cor) => { c.font = fonte; c.fillStyle = cor; c.textAlign = "left"; c.textBaseline = "alphabetic"; c.fillText(t, x, y); };
  const adv = px => { c.font = px + "px " + FONTE; return c.measureText("M").width; };

  c.fillStyle = P("editorbg"); c.fillRect(0, 0, 1080, 1080);
  // calha de números de linha
  c.fillStyle = P("gutterbg"); c.fillRect(0, 44, 52, 716);
  c.fillStyle = P("linenum"); c.font = "16px " + FONTE; c.textAlign = "right"; c.textBaseline = "middle";
  for (let n = 1; n <= 14; n++) c.fillText(String(n), 40, 65 + 49 * n);

  // título grande, reduzido se não couber
  const rotulo = "# DEFESA DE TCC " + info.tcc;
  let tam = 82; c.font = "bold " + tam + "px " + FONTE;
  const larg = c.measureText(rotulo).width;
  if (larg > 930) tam = Math.floor(tam * 930 / larg);
  const B0 = 122 + Math.round(65 * tam / 82);
  texto(rotulo, 75, B0, "bold " + tam + "px " + FONTE, P("codeaccent"));

  // blocos chave = "valor", com redução progressiva se o texto for longo
  const blocos = [["aluno", info.aluno], ["titulo", info.titulo], ["orientador", info.orientador]];
  if (info.coorientador) blocos.push(["coorientador", info.coorientador]);
  const montar = fs => {
    const a = adv(fs), maxC = Math.floor((930 + 6) / a), esc = fs / 38;
    let base = B0 + 50 + Math.round(29 * tam / 82), itens = [], ultimo = null;
    blocos.forEach((b, i) => {
      const linhas = quebrarTexto([{ t: b[0], c: "codekey" }, { t: ' = "', c: "codepunct" }, { t: b[1], c: "codestr" }, { t: '"', c: "codepunct" }], maxC);
      if (i > 0) base = ultimo + Math.round((67 + (/[gjpqyçÇ,;]/.test(itens[itens.length - 1].linhas[itens[itens.length - 1].linhas.length - 1].map(x => x.ch).join("")) ? 3 : 0)) * esc);
      itens.push({ linhas: linhas, base: base, pitch: 48 * esc });
      ultimo = base + (linhas.length - 1) * 48 * esc;
    });
    return { itens: itens, ultimo: ultimo, fs: fs, a: a };
  };
  let lay = null;
  for (const fs of [38, 34, 30, 27, 24, 21]) { lay = montar(fs); if (lay.ultimo <= 735) break; }
  lay.itens.forEach(it => it.linhas.forEach((ln, li) => {
    let x = 75; const y = it.base + li * it.pitch; let i = 0;
    while (i < ln.length) {
      let j = i; while (j < ln.length && ln[j].c === ln[i].c) j++;
      const trecho = ln.slice(i, j).map(x2 => x2.ch).join("");
      texto(trecho, x, y, lay.fs + "px " + FONTE, P(ln[i].c)); x += lay.a * (j - i); i = j;
    }
  }));

  // painel de terminal
  c.fillStyle = P("terminalbg"); c.fillRect(0, 760, 1080, 320);
  c.strokeStyle = P("bordasutil"); c.lineWidth = 1; c.beginPath(); c.moveTo(0, 759.5); c.lineTo(1080, 759.5); c.stroke();
  texto("bash", 75, 807, "15px " + FONTE, P("linenum"));
  const f30 = "30px " + FONTE, a30 = adv(30);
  texto("$ ", 75, 854, f30, P("promptgreen")); texto("python defesa_tcc.py", 75 + 2 * a30, 854, f30, P("codepunct"));
  texto(">>> ", 75, 913, f30, P("linenum")); texto(info.data, 75 + 4 * a30, 913, f30, P("codeaccent"));
  texto(">>> ", 75, 961, f30, P("linenum")); texto(info.local, 75 + 4 * a30, 961, f30, P("codeaccent"));
  texto("$ ", 75, 1018, f30, P("promptgreen"));
  c.fillStyle = P("codepunct"); c.fillRect(109, 994, 16, 27);

  // barra de título da janela
  c.fillStyle = P("titlebarbg"); c.fillRect(0, 0, 1080, 44);
  [[30, "semaforovermelho"], [56, "semaforoamarelo"], [82, "semaforoverde"]].forEach(p => { c.fillStyle = P(p[1]); c.beginPath(); c.arc(p[0], 22, 8, 0, 2 * Math.PI); c.fill(); });
  c.fillStyle = P("tabbg"); c.fillRect(115, 0, 230, 40);
  c.fillStyle = P("tabaccent"); c.fillRect(115, 0, 230, 3);
  c.font = "16px " + FONTE; c.fillStyle = P("codepunct"); c.textAlign = "left"; c.textBaseline = "middle"; c.fillText("defesa_tcc.py", 130, 21);
}

let cardDefesa = null;
function paletaAleatoria(exceto) {
  const nomes = Object.keys(PALETAS).filter(n => n !== exceto);
  return nomes[Math.floor(Math.random() * nomes.length)];
}
function redesenharCard() { if (cardDefesa) desenharCard($("cvCard"), infoCard(cardDefesa), PALETAS[$("cdPaleta").value]); }
function abrirCard(d) {

  if (!sel.options.length) Object.keys(PALETAS).forEach(n => { const o = document.createElement("option"); o.value = n; o.textContent = n; sel.append(o); });
  sel.value = paletaAleatoria(null);
  const cl = $("cdLinks"); cl.textContent = ""; cl.append(...anchors(d, "bt")); cl.classList.toggle("oculto", !cl.childNodes.length);

}

let pdfPronto = null;
function carregarPdfLib() {
  if (window.PDFLib && typeof ASSET_LOGO_B64 !== "undefined") return Promise.resolve();
  if (!pdfPronto) pdfPronto = new Promise((res, rej) => {
    const sc = document.createElement("script"); sc.src = "pdflib_recursos.js";
    sc.onload = () => res(); sc.onerror = () => { pdfPronto = null; rej(new Error("não foi possível carregar pdflib_recursos.js (ele precisa estar na mesma pasta do index.html)")); };
    document.head.append(sc);
  });
  return pdfPronto;
}
async function gerarZip(ds, rotulo) {
  if (!ds.length) { $("status").textContent = "Nenhuma defesa no período para gerar documentos."; return; }
  const faltam = [...new Set(ds.flatMap(d => membrosOrdenados(d)))].map(prof).filter(p => !p.trat || !p.grau).map(p => p.nome);
  $("status").textContent = "Gerando PDFs..." + (faltam.length ? " Atenção: sem tratamento ou titulação na aba Professores: " + faltam.join(", ") + "." : "");
  try {
    await carregarPdfLib();
    const arqs = [];
    for (const d of ds) {
      const al = aluno(d.alunoId) || { nome: "aluno" }, base = aaaammdd(d.data) + "_" + slug(al.nome);
      for (const f of d.fases) arqs.push({ nome: base + "_ata_pg" + (f === "TCC2" ? "2" : "1") + ".pdf", dados: await montarAtaPdf(d, f) });
      for (const id of membrosOrdenados(d)) { const p = prof(id); arqs.push({ nome: base + "_ficha_" + slug(p.nome) + ".pdf", dados: await montarFichaPdf(d, p) }); }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(criarZip(arqs));
    a.download = "atas_fichas_" + rotulo + ".zip"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    $("status").textContent = "ZIP gerado com " + arqs.length + " PDF(s) de " + ds.length + " defesa(s)." + (faltam.length ? " Sem tratamento ou titulação: " + faltam.join(", ") + " (cadastre na aba Professores)." : "");
  } catch (e) { $("status").textContent = "Erro ao gerar PDFs: " + e.message; console.error(e); }
}
const DIAS_SEM = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
function defesasImp() {
  const esc = $("impEsc").value, h = hoje();
  let l = [...defesasVisiveis()];
  if (esc === "semana") { const a = semana, b = somaDias(semana, 5); l = l.filter(d => { const dt = parseBR(d.data); return dt >= a && dt < b; }); }
  else if (esc === "futuras") l = l.filter(d => parseBR(d.data) >= h);
  l.sort((x, y) => (parseBR(x.data) - parseBR(y.data)) || (toMin(x.inicio) - toMin(y.inicio)));

}
function linhaImp(d) {

  const o = prof(al.orientadorId), co = al.coorientadorId ? prof(al.coorientadorId) : null;

  return {
    data: d.data, dia: DIAS_SEM[dt.getDay()], ini: d.inicio, fim: fmtMin(fimMin(d)), dur: d.duracao + " min",
    fase: rotuloFases(d.fases), aluno: al.nome, titulo: d.titulo || "", orient: o ? o.nome : "", coorient: co ? co.nome : "",
    banca: banca.join(", "), todos: d.bancaIds.map(nomeProf).join(", "), sala: nomeSala(d.salaId),
    link: (salaDe(d) || {}).link || "", pdf: d.pdf ? baseSite() + d.pdf : ""

function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function montarFolha() {
  const ds = defesasImp(), linhas = ds.map(linhaImp);
  const rot = { semana: "Semana de " + fmtBR(semana) + " a " + fmtBR(somaDias(semana, 4)), futuras: "Defesas a partir de " + fmtBR(hoje()), todas: "Todas as defesas" }[$("impEsc").value];

    h += "</table>";
  }
  $("folhaImp").innerHTML = h;
}
